services:
  home-dev:
    build:
      context: .
      dockerfile: docker/home/Dockerfile
    image: upper-body-teleop-home:humble
    container_name: upper_body_teleop_home
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /workspace
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true

services:
  lab-dev:
    build:
      context: ..
      dockerfile: docker/lab/Dockerfile
    image: upper-body-teleop-lab:latest
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-0}
      - VIDEO_DEVICE=${VIDEO_DEVICE:-/dev/video0}
      - UNITREE_MUJOCO_ROOT=/opt/unitree_mujoco
      - G1_MUJOCO_XML=${G1_MUJOCO_XML:-/opt/unitree_mujoco/unitree_robots/g1/g1_29dof.xml}
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /opt/unitree_mujoco:/opt/unitree_mujoco:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
